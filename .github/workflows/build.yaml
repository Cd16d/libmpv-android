name: Build libmpv-android

on: 
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-jinja2 gperf nasm
          sudo pip3 install --break-system-packages meson

      - name: Download dependencies
        working-directory: ./buildscripts
        env:
          IN_CI: 1
          WGET: wget --tries=5 --waitretry=10 --retry-connrefused --retry-on-host-error
        run: ./download.sh

      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh

      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh

      - name: Check AAR
        run: ./buildscripts/check-aar.sh

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-release.aar
          path: ./libmpv/build/outputs/aar/libmpv-release.aar
