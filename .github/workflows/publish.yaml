name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to publish (e.g. 1.1.0-filters or v1.1.0-filters)'
        required: false
        default: '1.1.0-filters'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Version
        id: vars
        run: |
          raw_tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${raw_tag#v}"
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "TAG=v$version" >> "$GITHUB_OUTPUT"

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip python3-jinja2 gperf nasm
          sudo pip3 install --break-system-packages meson

      - name: Download dependencies
        working-directory: ./buildscripts
        env:
          IN_CI: 1
          WGET: wget --tries=5 --waitretry=10 --retry-connrefused --retry-on-host-error
        run: ./download.sh

      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh

      - name: Pack corresponding source
        run: |
          name="libmpv-${{ steps.vars.outputs.VERSION }}-sources"
          tar --exclude=.git --exclude=./buildscripts/sdk \
              --transform "s,^\.,$name," -cf - . | xz -T0 -6 > "$RUNNER_TEMP/$name.tar.xz"

      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh

      - name: Check AAR
        run: ./buildscripts/check-aar.sh

      - name: Create GitHub Release
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          draft: false
          files: |
            ./libmpv/build/outputs/aar/libmpv-release.aar
            ${{ runner.temp }}/libmpv-*-sources.tar.xz

      - name: Publish to Maven Central
        run: |
          raw_key="${{ secrets.SIGNING_KEY_ID }}"
          clean_key="$(echo -n "$raw_key" | tr -d '[:space:]')"
          clean_key="${clean_key#0x}"
          short_key="${clean_key: -8}"
          echo "Using sanitized GPG key ID: $short_key"
          export ORG_GRADLE_PROJECT_signingInMemoryKeyId="$short_key"
          ./gradlew publishToMavenCentral --no-configuration-cache \
            -PVERSION_NAME="${{ steps.vars.outputs.VERSION }}" \
            -PsigningInMemoryKeyId="$short_key"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
